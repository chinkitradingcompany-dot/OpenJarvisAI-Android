
name: Build OpenJarvis AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout starter repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Clone upstream projects
        run: |
          git clone --depth 1 https://github.com/open-jarvis/OpenJarvis.git work/OpenJarvis
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git work/llama.cpp

      - name: Brand app
        run: |
          STRINGS="work/llama.cpp/examples/llama.android/app/src/main/res/values/strings.xml"
          GRADLE="work/llama.cpp/examples/llama.android/app/build.gradle.kts"
          python3 - <<'PY'
          from pathlib import Path
          import re
          strings = Path("work/llama.cpp/examples/llama.android/app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s, n = re.subn(r'(<string\s+name="app_name"\s*>).*?(</string>)',
                         r'\1OpenJarvis AI\2', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not brand launcher app name")
          strings.write_text(s)
          gradle = Path("work/llama.cpp/examples/llama.android/app/build.gradle.kts")
          g = gradle.read_text()
          g, n = re.subn(r'applicationId\s*=\s*"[^"]+"',
                         'applicationId = "ai.openjarvis.mobile"', g, count=1)
          if n != 1:
              raise SystemExit("Could not set applicationId")
          gradle.write_text(g)
          PY

      - name: Build debug APK
        working-directory: work/llama.cpp/examples/llama.android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-AI-debug-APK
          path: work/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
